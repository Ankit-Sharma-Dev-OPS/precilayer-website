<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading...</title>
  <script>
    // GitHub Pages SPA Routing Handler
    // This file is served by GitHub Pages when a route doesn't exist as a static file.
    // It redirects to index.html while preserving the requested route for React Router.
    
    (function() {
      const pathname = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;
      
      // Parse pathname segments
      // e.g., /precilayer-website/industries/space-satellite -> ['precilayer-website', 'industries', 'space-satellite']
      const segments = pathname.split('/').filter(Boolean);
      
      if (segments.length === 0) {
        // Edge case: root path, just redirect to index.html
        window.location.replace('/')
        return;
      }
      
      // First segment should be the repository name
      const repoName = segments[0];
      
      // Everything after the repo name is the route
      // e.g., /industries/space-satellite
      const route = segments.length > 1 
        ? '/' + segments.slice(1).join('/')
        : '/';
      
      // Store the intended route in sessionStorage for React Router to use
      // Include search and hash if present
      const fullRoute = route + search + hash;
      sessionStorage.setItem('spaRedirect', fullRoute);
      
      // Redirect to the root index.html
      // This will load the React app which will check sessionStorage and route accordingly
      const indexPath = '/' + repoName + '/index.html';
      window.location.replace(indexPath);
    })();
  </script>
  <noscript>
    <p>Please enable JavaScript to use this application.</p>
  </noscript>
</head>
<body>
  <p>Loading...</p>
</body>
</html>
