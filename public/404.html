<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading...</title>
  <script>
    // GitHub Pages SPA Routing Handler
    // Works with both custom domains and project repositories
    
    (function() {
      const pathname = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;
      const hostname = window.location.hostname;
      
      // For custom domains (precilayer.com): use pathname as-is
      // For project repos (github.io/precilayer-website): extract route after repo name
      
      let route = pathname;
      let indexPath = '/index.html';
      
      // Check if this is a GitHub Pages project repo (contains .github.io domain)
      if (hostname.includes('github.io')) {
        const segments = pathname.split('/').filter(Boolean);
        
        if (segments.length === 0) {
          window.location.replace('/');
          return;
        }
        
        // First segment is repo name for GitHub Pages project repo
        const repoName = segments[0];
        route = segments.length > 1 
          ? '/' + segments.slice(1).join('/')
          : '/';
        indexPath = '/' + repoName + '/index.html';
      }
      
      // Store the intended route in sessionStorage for React Router
      const fullRoute = route + search + hash;
      sessionStorage.setItem('spaRedirect', fullRoute);
      
      // Redirect to index.html
      window.location.replace(indexPath);
    })();
  </script>
  <noscript>
    <p>Please enable JavaScript to use this application.</p>
  </noscript>
</head>
<body>
  <p>Loading...</p>
</body>
</html>
