         The Cartographer creates Workers that throw uncaught errors, triggering
         false "crashed" alerts. This no-op is scoped to *.replit.dev only,
         so production deployments are completely unaffected. -->
    <script>
      (function() {
        if (typeof Worker === 'undefined') return;
        if (!location.hostname.endsWith('.replit.dev')) return;
        function NoopWorker() {
          this.postMessage = function() {};
          this.terminate = function() {};
          this.addEventListener = function() {};
          this.removeEventListener = function() {};
          this.dispatchEvent = function() { return true; };
          this.onerror = null;
          this.onmessage = null;
          this.onmessageerror = null;
        }
        NoopWorker.prototype = Worker.prototype;
        window.Worker = NoopWorker;
      })();
    </script>
